# Render Blueprint (optional). You can also create the Background Worker in the UI.
services:
  - type: worker
    name: btc-15m-paper-bot
    runtime: python
    plan: starter
    region: oregon
    branch: cursor/alerts-backup-calibration-1b7a
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start_render.sh
    autoDeploy: true
    disk:
      name: paper-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATA_DIR
        value: /var/data
      - key: PAPER_INITIAL_BALANCE
        value: "100"
      - key: STAKE_NOTIONAL
        value: "5"
      - key: VAULT_ENABLED
        value: "true"
      - key: VAULT_TRIGGER_PROFIT
        value: "55"
      - key: VAULT_WITHDRAW_AMOUNT
        value: "50"
      - key: VAULT_GOAL
        value: "300"
      - key: AUTO_BET
        value: "true"
      - key: MIN_EDGE
        value: "0.08"
      - key: STRIKE_SOURCE
        value: kalshi
      - key: KALSHI_SERIES
        value: KXBTC15M
      - key: SYMBOL
        value: BTC/USD
      - key: DATA_PROVIDER
        value: coinbase
      - key: TELEGRAM_ALERTS
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RESET_PAPER_HISTORY
        value: "true"
